<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueForum</title>

<style>
:root {
    --blue: #1683ff;
    --blue-dark: #0756ad;
    --black: #05070a;
    --panel: #0b1017;
    --panel2: #101823;
    --border: #1d344d;
    --white: #f4f8ff;
    --gray: #8c9aaa;
    --green: #35d07f;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: "Courier New", monospace;
}

header {
    height: 55px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    background: #080d13;
    border-bottom: 1px solid var(--border);
}

.logo {
    color: var(--blue);
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 2px;
}

.status {
    margin-left: auto;
    color: var(--green);
    font-size: 12px;
}

.layout {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

.composer {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 15px;
    margin-bottom: 25px;
}

label {
    display: block;
    color: var(--blue);
    margin-bottom: 6px;
}

input,
textarea {
    width: 100%;
    padding: 11px;
    margin-bottom: 14px;
    color: white;
    background: #05080c;
    border: 1px solid var(--border);
    outline: none;
    font-family: inherit;
}

input:focus,
textarea:focus {
    border-color: var(--blue);
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    padding: 11px 22px;
    color: white;
    background: var(--blue-dark);
    border: 1px solid var(--blue);
    cursor: pointer;
    font-family: inherit;
}

button:hover {
    background: var(--blue);
}

.info {
    color: var(--gray);
    font-size: 12px;
    margin-top: 10px;
}

h2 {
    color: var(--blue);
    font-size: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
}

.post {
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 12px;
}

.post-head {
    padding: 10px 13px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
}

.author {
    color: var(--blue);
    font-weight: bold;
}

.date {
    color: var(--gray);
    font-size: 11px;
    margin-left: 10px;
}

.message {
    padding: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.empty {
    color: var(--gray);
    padding: 25px;
    text-align: center;
}

@media(max-width:600px) {
    .layout {
        padding: 15px 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">BLUEFORUM</div>
    <div class="status">● ONLINE</div>
</header>

<main class="layout">

    <section class="composer">

        <label for="name">NAME</label>

        <input
            id="name"
            maxlength="32"
            placeholder="your name"
        >

        <label for="message">MESSAGE</label>

        <textarea
            id="message"
            maxlength="2000"
            placeholder="Write something..."
        ></textarea>

        <button onclick="postMessage()">
            POST
        </button>

        <div class="info">
            Your post will open as a GitHub submission.
        </div>

    </section>

    <h2>RECENT POSTS</h2>

    <div id="posts">
        <div class="empty">
            Loading posts...
        </div>
    </div>

</main>

<script>
/*
    CHANGE THESE TWO VALUES
*/
const OWNER = "YOUR_GITHUB_USERNAME";
const REPO = "YOUR_REPOSITORY";


async function loadPosts() {

    const container = document.getElementById("posts");

    try {

        const response = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/issues?state=open&per_page=50`
        );

        const issues = await response.json();

        container.innerHTML = "";

        if (!issues.length) {
            container.innerHTML =
                '<div class="empty">No posts yet.</div>';
            return;
        }

        issues.forEach(issue => {

            const post = document.createElement("div");
            post.className = "post";

            const body =
                issue.body || "";

            post.innerHTML = `
                <div class="post-head">
                    <span class="author">
                        ${escapeHTML(issue.user.login)}
                    </span>

                    <span class="date">
                        ${new Date(issue.created_at).toLocaleString()}
                    </span>
                </div>

                <div class="message">
                    ${escapeHTML(body)}
                </div>
            `;

            container.appendChild(post);
        });

    } catch (error) {

        container.innerHTML =
            '<div class="empty">Unable to load posts.</div>';
    }
}


function postMessage() {

    const name =
        document.getElementById("name").value.trim();

    const message =
        document.getElementById("message").value.trim();

    if (!message) {
        alert("Write a message first.");
        return;
    }

    const title =
        (name || "anonymous") +
        ": " +
        message.substring(0, 50);

    const body =
        message +
        "\n\n---\nPosted by: " +
        (name || "anonymous");

    /*
        Opens GitHub's new Issue page with the
        message already filled in.
    */

    const url =
        `https://github.com/${OWNER}/${REPO}/issues/new` +
        `?title=${encodeURIComponent(title)}` +
        `&body=${encodeURIComponent(body)}`;

    window.open(url, "_blank");
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


loadPosts();

setInterval(loadPosts, 15000);
</script>

</body>
</html>
