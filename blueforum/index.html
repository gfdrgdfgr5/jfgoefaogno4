<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BlueForum</title>

<style>
:root {
    --blue: #1683ff;
    --blue-dark: #0756ad;
    --black: #05070a;
    --panel: #0b1017;
    --panel2: #101823;
    --border: #1d344d;
    --white: #f4f8ff;
    --gray: #8c9aaa;
    --green: #35d07f;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: "Courier New", monospace;
}

header {
    height: 55px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    background: #080d13;
    border-bottom: 1px solid var(--border);
}

.logo {
    color: var(--blue);
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 2px;
}

.status {
    margin-left: auto;
    color: var(--green);
    font-size: 12px;
}

.layout {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

.composer {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 15px;
    margin-bottom: 25px;
}

label {
    display: block;
    color: var(--blue);
    margin-bottom: 6px;
}

input,
textarea {
    width: 100%;
    padding: 11px;
    margin-bottom: 14px;
    color: white;
    background: #05080c;
    border: 1px solid var(--border);
    outline: none;
    font-family: inherit;
}

input:focus,
textarea:focus {
    border-color: var(--blue);
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    padding: 11px 22px;
    color: white;
    background: var(--blue-dark);
    border: 1px solid var(--blue);
    cursor: pointer;
    font-family: inherit;
}

button:hover {
    background: var(--blue);
}

.info {
    color: var(--gray);
    font-size: 12px;
    margin-top: 10px;
}

h2 {
    color: var(--blue);
    font-size: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
}

.post {
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 12px;
}

.post-head {
    padding: 10px 13px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
}

.author {
    color: var(--blue);
    font-weight: bold;
}

.date {
    color: var(--gray);
    font-size: 11px;
    margin-left: 10px;
}

.message {
    padding: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.empty {
    color: var(--gray);
    padding: 25px;
    text-align: center;
}

.error {
    color: #ff657a;
    padding: 25px;
    text-align: center;
}

@media(max-width:600px) {
    .layout {
        padding: 15px 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">BLUEFORUM</div>
    <div class="status">● ONLINE</div>
</header>

<main class="layout">

    <section class="composer">

        <label for="name">NAME</label>

        <input
            id="name"
            maxlength="32"
            placeholder="your name"
        >

        <label for="message">MESSAGE</label>

        <textarea
            id="message"
            maxlength="2000"
            placeholder="Write something..."
        ></textarea>

        <button id="postButton">
            POST
        </button>

        <div class="info">
            Click POST to submit your message.
        </div>

    </section>

    <h2>RECENT POSTS</h2>

    <div id="posts">
        <div class="empty">
            Loading posts...
        </div>
    </div>

</main>

<script>

/*
==================================================
CHANGE THESE TWO VALUES
==================================================
*/

const OWNER = "gfdrgdfgr5";
const REPO = "jfgoefaogno4";


/*
==================================================
LOAD POSTS
==================================================
*/

async function loadPosts() {

    const container =
        document.getElementById("posts");

    try {

        /*
        Add a timestamp so GitHub Pages doesn't
        keep showing an old cached posts.json.
        */

        const response = await fetch(
            `posts.json?time=${Date.now()}`,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("posts.json not found");
        }

        const posts = await response.json();

        container.innerHTML = "";

        if (!Array.isArray(posts) || posts.length === 0) {

            container.innerHTML =
                `<div class="empty">
                    No posts yet.
                </div>`;

            return;
        }

        /*
        Newest posts first
        */

        posts
            .slice()
            .reverse()
            .forEach(post => {

                const element =
                    document.createElement("article");

                element.className = "post";

                const author =
                    post.author || "anonymous";

                const message =
                    post.message || "";

                let date = "";

                if (post.created) {
                    date = new Date(
                        post.created
                    ).toLocaleString();
                }

                element.innerHTML = `

                    <div class="post-head">

                        <span class="author">
                            ${escapeHTML(author)}
                        </span>

                        <span class="date">
                            ${escapeHTML(date)}
                        </span>

                    </div>

                    <div class="message">
                        ${escapeHTML(message)}
                    </div>
                `;

                container.appendChild(element);
            });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            `<div class="error">
                Unable to load posts.json.
                <br><br>
                Make sure the GitHub Action has run.
            </div>`;
    }
}


/*
==================================================
POST
==================================================
*/

function postMessage() {

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const message =
        document
            .getElementById("message")
            .value
            .trim();

    if (!message) {

        alert("Please enter a message.");

        return;
    }

    const author =
        name || "anonymous";

    /*
    The GitHub Issue becomes the post.
    The GitHub Action then copies it into
    posts.json.
    */

    const title =
        `[Forum] ${author}: ` +
        message.substring(0, 60);

    const body =
        message +
        "\n\n---\n" +
        "Author: " +
        author;

    const issueURL =
        `https://github.com/${OWNER}/${REPO}/issues/new` +
        `?title=${encodeURIComponent(title)}` +
        `&body=${encodeURIComponent(body)}`;

    window.open(
        issueURL,
        "_blank"
    );
}


/*
==================================================
SECURITY
==================================================
*/

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/*
==================================================
START
==================================================
*/

document
    .getElementById("postButton")
    .addEventListener(
        "click",
        postMessage
    );

loadPosts();


/*
Refresh every 15 seconds so newly-created
posts appear automatically after the Action
updates posts.json.
*/

setInterval(
    loadPosts,
    15000
);

</script>

</body>
</html>
